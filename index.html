<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>番茄工作法</h1>
            <p class="subtitle">专注工作，高效休息</p>
        </header>

        <section class="timer-section">
            <div class="mode-indicator">
                <span id="mode-label" class="mode-label">工作时间</span>
                <span id="mode-badge" class="mode-badge work"></span>
            </div>

            <div class="timer-display">
                <div class="timer-circle">
                    <svg class="progress-ring" viewBox="0 0 100 100">
                        <circle class="progress-ring-bg" cx="50" cy="50" r="45" />
                        <circle id="progress-ring" class="progress-ring-progress" cx="50" cy="50" r="45" />
                    </svg>
                    <div class="timer-text">
                        <span id="minutes">25</span>
                        <span class="separator">:</span>
                        <span id="seconds">00</span>
                    </div>
                </div>
            </div>

            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <div class="progress-labels">
                    <span>0%</span>
                    <span>100%</span>
                </div>
            </div>

            <div class="controls">
                <button id="reset-btn" class="control-btn reset-btn" aria-label="重置">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
                        <path d="M8 16H3v5"/>
                    </svg>
                </button>
                <button id="start-btn" class="control-btn start-btn" aria-label="开始">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 3v18M19 12l-7 5V7l7 5z"/>
                    </svg>
                </button>
                <button id="pause-btn" class="control-btn pause-btn" aria-label="暂停">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                    </svg>
                </button>
                <button id="pip-btn" class="control-btn pip-btn" aria-label="弹出桌面悬浮窗" title="弹出桌面悬浮窗">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <rect x="10" y="8" width="10" height="7" rx="1"/>
                    </svg>
                </button>
            </div>

            <div class="session-info">
                <span id="session-count">第 1 个番茄钟</span>
                <span id="today-count">今日完成: 0</span>
            </div>
        </section>

        <section class="history-section">
            <h2>使用记录</h2>
            <div id="history-list" class="history-list">
                <p class="empty-history">暂无记录</p>
            </div>
        </section>

        <section class="settings-section">
            <h2>偏好设置</h2>
            <div class="settings-group">
                <label class="setting-label">
                    <input type="number" id="work-duration" value="25" min="1" max="120">
                    <span>工作时长（分钟）</span>
                </label>
                <label class="setting-label">
                    <input type="number" id="break-duration" value="5" min="1" max="60">
                    <span>休息时长（分钟）</span>
                </label>
            </div>
            <button id="save-settings" class="save-btn">保存设置</button>
        </section>
    </main>

    <footer class="footer">
        <p>专注每一个番茄钟，提升工作效率</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
